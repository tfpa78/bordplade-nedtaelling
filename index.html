<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nedtælling til montering af bordplade</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      /* Baggrundsbillede af et køkken med mørkt slør for bedre læsbarhed */
      background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), 
                  url('https://unsplash.com');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #333;
      text-align: center;
    }
    .container {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
      max-width: 600px;
      width: 90%;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 10px;
      color: #2c3e50;
    }
    .target-info {
      font-size: 1.1rem;
      color: #5a6a7e;
      margin-bottom: 30px;
      font-weight: 500;
    }
    .countdown {
      display: flex;
      justify-content: space-around;
      gap: 15px;
    }
    .time-box {
      background: #2c3e50;
      color: white;
      padding: 20px 10px;
      border-radius: 8px;
      flex: 1;
    }
    .number {
      font-size: 2.5rem;
      font-weight: bold;
      display: block;
    }
    .label {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 5px;
      display: block;
      color: #bdc3c7;
    }
    .done-message {
      font-size: 1.5rem;
      font-weight: bold;
      color: #27ae60;
    }
    @media (max-width: 480px) {
      .countdown {
        gap: 8px;
      }
      .number {
        font-size: 1.8rem;
      }
      .label {
        font-size: 0.7rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Nedtælling til montering af bordplade</h1>
    <p class="target-info">Onsdag den 16. december 2026 kl. 08:00</p>
    
    <div id="countdown" class="countdown">
      <div class="time-box">
        <span id="days" class="number">00</span>
        <span class="label">Dage</span>
      </div>
      <div class="time-box">
        <span id="hours" class="number">00</span>
        <span class="label">Timer</span>
      </div>
      <div class="time-box">
        <span id="minutes" class="number">00</span>
        <span class="label">Minutter</span>
      </div>
      <div class="time-box">
        <span id="seconds" class="number">00</span>
        <span class="label">Sekunder</span>
      </div>
    </div>
  </div>

  <script>
    // Mål-dato: 16. december 2026 kl. 08:00:00 (Dansk tid / CET)
    const targetDate = new Date("2026-12-16T08:00:00+01:00").getTime();

    const timer = setInterval(function() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      // Hvis nedtællingen er færdig
      if (distance < 0) {
        clearInterval(timer);
        document.getElementById("countdown").innerHTML = 
          "<div class='done-message'>Nu bliver bordpladen monteret!</div>";
        return;
      }

      // Beregning af dage, timer, minutter og sekunder
      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      // Opdater visningen
      document.getElementById("days").innerText = days.toString().padStart(2, '0');
      document.getElementById("hours").innerText = hours.toString().padStart(2, '0');
      document.getElementById("minutes").innerText = minutes.toString().padStart(2, '0');
      document.getElementById("seconds").innerText = seconds.toString().padStart(2, '0');
    }, 1000);
  </script>

</body>
</html>
